name: Build resumable Audiobookshelf image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/update-audiobookshelf-2.37.2

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/keeper1978/audiobookshelf:2.37.2-resumable
          cache-from: type=gha
          cache-to: type=gha,mode=max
